{% extends 'base.html' %}
{% block title %}Registrar persona{% endblock %}
{% block content %}
<h2>Registrar persona</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="actions">
        <button class="button" type="submit">Guardar persona</button>
        <a class="button secondary" href="{% url 'lobby' %}">Volver al lobby</a>
    </div>
</form>
{% endblock %}
